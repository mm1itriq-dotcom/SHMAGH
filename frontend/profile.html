<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SHMAGH</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=1790460280">
    <link rel="stylesheet" href="css/profile.css?v=1790459131">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto !important;
            margin: 0;
        }
    </style>

    <script>
        if (!sessionStorage.getItem('shmagh_token')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <!-- Navbar -->
    <nav class="dest-navbar profile-navbar">
        <div class="logo">
            <a href="home.html"><img src="assets/logo.png" alt="SHMAGH" class="logo-img" style="height: 50px; width: auto;"></a>
        </div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="#">Favorite</a></li>
            <li><a href="#" id="nav-converter">Converter</a></li>
            <li>
                <div class="lang-switch-container">
                    <span class="lang-label en-label active-lang">EN</span>
                    <label class="switch">
                        <input type="checkbox" id="lang-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="lang-label ar-label">عربي</span>
                </div>
            </li>
            <li class="logout-container">
                <a href="#" class="profile-btn logout-btn" aria-label="Log Out">
                    <i class="ph ph-sign-out"></i> LOG OUT
                </a>
            </li>
        </ul>
    </nav>

    <!-- Profile Hero -->
    <div class="profile-hero">
        <div class="profile-hero-gradient"></div>
    </div>

    <!-- Profile Content -->
    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-circle">
                <i class="ph ph-user"></i>
            </div>
            <div class="avatar-label">Home</div>
            <h1 class="profile-name" id="display-name">Ahmad Al-Fayed</h1>
        </div>
        
        <div class="profile-tabs">
            <button class="tab-btn" data-tab="journal">JOURNAL</button>
            <button class="tab-btn" data-tab="saved">SAVED</button>
            <button class="tab-btn active" data-tab="settings">SETTINGS</button>
        </div>

        <div class="tab-content active" id="settings">
            <div class="cards-wrapper">
                <!-- Personal Info Card -->
                <div class="profile-card">
                    <h3 class="card-title">PERSONAL INFO</h3>
                    
                    <div class="input-group" style="position: relative;">
                        <label>Full Name</label>
                        <input type="text" id="input-name" value="Ahmad Al-Fayed" readonly>
                    </div>
                    
                    <div class="input-group" style="position: relative;">
                        <label>Email Address</label>
                        <input type="email" id="input-email" value="ahmad@email.jo" readonly>
                    </div>
                </div>

                <!-- Security Card -->
                <div class="profile-card">
                    <h3 class="card-title">SECURITY</h3>
                    
                    <div class="input-group" style="position: relative;">
                        <label>Current Password</label>
                        <input type="password" placeholder="Enter current password">
                        <i class="ph ph-eye toggle-password" style="position: absolute; right: 1.25rem; bottom: 1.1rem; cursor: pointer; color: #888; font-size: 1.1rem;"></i>
                    </div>
                    
                    <div class="input-group" style="position: relative;">
                        <label>New Password</label>
                        <input type="password" placeholder="Enter new password">
                        <i class="ph ph-eye toggle-password" style="position: absolute; right: 1.25rem; bottom: 1.1rem; cursor: pointer; color: #888; font-size: 1.1rem;"></i>
                    </div>
                    
                    <button id="update-password-btn" class="gold-btn" style="margin-top: 1rem; border-radius: 8px;">UPDATE PASSWORD</button>
                </div>
            </div>
        </div>
        
        <div class="tab-content" id="journal">
            <div class="empty-state">
                <p>Your journal is empty.</p>
            </div>
        </div>
        
        <div class="tab-content" id="saved">
            <div class="empty-state">
                <p>You haven't saved any destinations yet.</p>
            </div>
        </div>
    </div>

    <script src="js/converter.js"></script>
    <script src="js/profile.js?v=3"></script>
    <script src="js/toast.js?v=3"></script>
    <script src="js/shared.js?v=3"></script>
</body>
</html>
